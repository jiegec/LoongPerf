site_name: LoongPerf
site_description: LoongArch instruction-level performance data
site_url: https://jia.je/loongperf

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky

nav:
  - Overview: index.md
  - Methodology: methodology.md

plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

